name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/v')"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Set API base URL
        working-directory: app
        run: |
          API_URL="${{ secrets.API_BASE_URL }}"
          if [ -n "$API_URL" ]; then
            sed -i "s|https://your-server.com/api|$API_URL|g" src/services/api.ts
          fi

      - name: Generate debug keystore
        working-directory: app/android/app
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3'

      - name: Build Debug APK
        working-directory: app/android
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-release:
    name: Release APK
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/v')"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Set API base URL
        working-directory: app
        run: |
          sed -i "s|https://your-server.com/api|${{ secrets.API_BASE_URL }}|g" src/services/api.ts

      - name: Decode keystore
        working-directory: app/android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > yedidiagmc.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3'

      - name: Build Release APK
        working-directory: app/android
        env:
          MYAPP_UPLOAD_STORE_FILE: yedidiagmc.keystore
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          name: YedidiaGMC ${{ github.ref_name }}
